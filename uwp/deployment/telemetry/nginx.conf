# Include this file from the proxy's existing HTTP context after the TLS certificate exists.
limit_req_zone $binary_remote_addr zone=horizontelemetry_requests:10m rate=5r/s;

upstream horizon_telemetry_backend {
    zone horizon_telemetry_backend 64k;
    server horizontelemetry-backend:8080 resolve;
}

server {
    listen 80;
    listen [::]:80;
    server_name horizontelemetry.bytesdirect.com;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 256k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name horizontelemetry.bytesdirect.com;
    ssl_certificate /etc/letsencrypt/live/horizontelemetry.bytesdirect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horizontelemetry.bytesdirect.com/privkey.pem;
    include /etc/nginx/options-ssl-nginx.conf;
    ssl_dhparam /etc/nginx/ssl-dhparams.pem;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 256k;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        limit_req zone=horizontelemetry_requests burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://horizon_telemetry_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
