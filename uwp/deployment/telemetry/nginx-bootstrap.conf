# Temporary HTTP-01 vhost. It intentionally serves no telemetry over cleartext HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name horizontelemetry.bytesdirect.com;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 256k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 404; }
}
