[package]
name = "horizon-native-window"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
uwp-dx11-renderer = []
default = ["native-d3d11"]
native-d3d11 = ["dep:horizon-uwp-d3d11", "dep:log", "dep:windows"]

[dependencies]
horizon-uwp-d3d11 = { path = "../d3d11-backend", optional = true }
log = { version = "0.4", optional = true }
windows = { version = "0.62.2", features = ["Win32_Foundation"], optional = true }
