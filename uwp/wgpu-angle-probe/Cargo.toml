[package]
name = "wgpu-uwp-probe"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "gles", "wgsl"] }
raw-window-handle = "0.6"
pollster = "0.4"

[patch.crates-io]
wgpu-hal = { path = "../../third_party/wgpu-hal" }

